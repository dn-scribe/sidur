<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>סידור אישי</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#8a5a3c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="סידור" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="app-header" id="app-header">
  <div class="header-start">
    <button id="btn-back" class="icon-btn header-back" hidden title="חזרה">→</button>
    <span class="app-title" id="header-title">📖 סידור</span>
  </div>
  <nav class="header-actions">
    <button id="btn-en-toggle" class="icon-btn" title="הצגת תרגום אנגלי" hidden>EN</button>
    <button id="btn-view-toggle" class="icon-btn" title="החלפת תצוגה" hidden>⇔</button>
    <button id="btn-toc" class="icon-btn" title="תוכן עניינים" hidden>☰</button>
    <button id="btn-settings" class="icon-btn" title="הגדרות">⚙</button>
    <button id="btn-export" class="icon-btn" title="ייצוא/ייבוא">💾</button>
  </nav>
</header>

<main id="app-main">

  <!-- BOOK LIST SCREEN -->
  <section id="screen-books" class="screen active">
    <div class="search-bar">
      <input type="text" id="input-book-search" placeholder="חיפוש סידור..." autocomplete="off" />
    </div>
    <div id="my-siddurs-section" hidden>
      <h3 class="section-label">הסידורים שלי</h3>
      <ul id="my-siddurs-list" class="siddur-list"></ul>
    </div>
    <div id="book-categories"></div>
    <div id="storage-info" class="storage-info muted"></div>
  </section>

  <!-- TOC SCREEN -->
  <section id="screen-toc" class="screen">
    <div class="toc-header">
      <h2 id="toc-book-title"></h2>
      <p id="toc-book-hetitle" class="muted"></p>
      <button id="btn-toc-filter" class="secondary toc-filter-btn">⊚ הצג רק פרקים שנגעתי</button>
    </div>
    <div id="toc-tree" class="toc-tree"></div>
  </section>

  <!-- READER SCREEN -->
  <section id="screen-reader" class="screen">
    <div class="reader-info">
      <h2 id="reader-section-title" class="reader-section-title"></h2>
      <button id="btn-edit-section-title" class="icon-btn" title="עריכת כותרת הפרק">✏</button>
      <button id="btn-add-shortcut" class="icon-btn" title="הוסף לקיצורים">★</button>
      <button id="btn-undo-merge" class="icon-btn" title="ביטול מיזוג אחרון" hidden>↩⊞</button>
      <button id="btn-remove-section" class="icon-btn" title="הסרת פרק מהסידור">🚫</button>
      <button id="btn-export-docx" class="icon-btn" title="ייצוא DOCX" hidden>⬇</button>
    </div>
    <div class="reader-nav reader-nav-top">
      <button id="btn-prev-section" class="nav-btn secondary" disabled>← הקודם</button>
      <button id="btn-next-section" class="nav-btn secondary" disabled>הבא →</button>
    </div>
    <div id="reader-content" class="reader-content"></div>
    <div class="reader-nav reader-nav-bottom">
      <button id="btn-prev-section-bottom" class="nav-btn secondary" disabled>← הקודם</button>
      <button id="btn-next-section-bottom" class="nav-btn secondary" disabled>הבא →</button>
    </div>
  </section>

</main>

<!-- SETTINGS MODAL -->
<div id="modal-settings" class="modal-overlay" hidden>
  <div class="modal-box modal-settings-box">
    <div class="modal-header">
      <h3>הגדרות</h3>
      <button id="btn-close-settings" class="icon-btn modal-close-btn" title="סגירה">✕</button>
    </div>
    <div id="settings-content"></div>
  </div>
</div>

<!-- EXPORT/IMPORT MODAL -->
<div id="modal-export" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3>ייצוא / ייבוא</h3>
    <p class="muted">שמירת גיבוי של כל ההערות שלכם לקובץ JSON, או ייבוא מקובץ שמור.</p>
    <div class="modal-actions">
      <button id="btn-do-export" class="primary">⬇ ייצוא לקובץ</button>
      <label class="btn-like secondary">
        ⬆ ייבוא מקובץ
        <input type="file" id="input-import" accept=".json" style="display:none" />
      </label>
      <button id="btn-close-export" class="secondary">סגירה</button>
    </div>
    <p id="export-status" class="muted"></p>
  </div>
</div>

<!-- IMAGE EDITOR MODAL -->
<div id="modal-image" class="modal-overlay" hidden>
  <div class="modal-box modal-image-box">
    <h3>עריכת תמונה</h3>
    <p class="muted" style="margin:0">גרור לחיתוך • סובב עם כפתורי החץ</p>
    <div class="image-editor-area">
      <canvas id="image-canvas"></canvas>
    </div>
    <div class="image-editor-controls">
      <button id="btn-rotate-ccw" class="secondary">↺ שמאל</button>
      <button id="btn-rotate-cw" class="secondary">↻ ימין</button>
      <button id="btn-crop-reset" class="secondary">⤢ איפוס חיתוך</button>
      <div style="flex:1"></div>
      <button id="btn-image-cancel" class="secondary">ביטול</button>
      <button id="btn-image-confirm" class="primary">הוספה</button>
    </div>
  </div>
</div>

<!-- INSERTION EDITOR MODAL -->
<div id="modal-insertion" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3 id="insertion-modal-title">הוספת הערה</h3>
    <label class="field-label">
      כותרת (אופציונלי)
      <input type="text" id="insertion-title-input" placeholder="כותרת..." autocomplete="off" />
    </label>
    <label class="field-label">
      טקסט
      <div class="editor-toolbar">
        <button type="button" id="btn-insertion-bold" class="toolbar-btn"><strong>B</strong></button>
      </div>
      <textarea id="insertion-text-input" rows="5" placeholder="טקסט הערה..."></textarea>
    </label>
    <div id="insertion-images-editor" class="insertion-images-editor"></div>
    <div class="modal-actions">
      <label class="btn-like secondary">
        📷 הוספת תמונה
        <input type="file" id="input-image-file" accept="image/*" style="display:none" />
      </label>
      <button id="btn-ai-image" class="secondary">✨ AI תמונה</button>
      <button id="btn-insertion-save" class="primary">שמירה</button>
      <button id="btn-insertion-cancel" class="secondary">ביטול</button>
    </div>
    <p id="insertion-status" class="muted"></p>
  </div>
</div>

<!-- DOCX EXPORT MODAL -->
<div id="modal-docx" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3>ייצוא DOCX</h3>
    <p id="docx-modal-subtitle" class="muted"></p>
    <div class="docx-orient-group">
      <label class="docx-orient-opt">
        <input type="radio" name="docx-orient" value="landscape" checked />
        לרוחב A4 (ברירת מחדל)
      </label>
      <label class="docx-orient-opt">
        <input type="radio" name="docx-orient" value="portrait" />
        לאורך A4
      </label>
    </div>
    <div class="modal-actions">
      <button id="btn-do-docx" class="primary">⬇ ייצוא</button>
      <button id="btn-close-docx" class="secondary">ביטול</button>
    </div>
    <p id="docx-status" class="muted"></p>
  </div>
</div>

<!-- AI IMAGE MODAL -->
<div id="modal-ai-image" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3>✨ יצירת תמונה עם AI</h3>
    <div id="ai-base-prompt-display" class="ai-base-prompt-display muted"></div>
    <label class="field-label">
      תיאור התמונה
      <textarea id="ai-prompt-input" rows="3" placeholder="תאר את התמונה שברצונך ליצור..."></textarea>
    </label>
    <div id="ai-image-result" class="ai-image-result" hidden>
      <img id="ai-result-img" src="" alt="תוצאה" />
    </div>
    <p id="ai-status" class="muted ai-status"></p>
    <div class="modal-actions">
      <button id="btn-ai-generate" class="primary">✨ יצירה</button>
      <button id="btn-ai-approve" class="primary" hidden>✓ הוספה לסידור</button>
      <button id="btn-ai-cancel" class="secondary">ביטול</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast" hidden></div>

<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/version.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sidur/sw.js', { scope: '/sidur/' })
        .catch(err => console.warn('[SW] Registration failed', err));
    });
  }
</script>
</body>
</html>
