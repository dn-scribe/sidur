plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.sidur.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sidur.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
